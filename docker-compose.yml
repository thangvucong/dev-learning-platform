name: dev-learning-platform

x-app-base: &app-base
    build:
        context: .
    restart: unless-stopped
    environment:
        DB_HOST: db
        REDIS_HOST: redis
    volumes:
        - ./:/var/www
    networks:
        - backend

services:
    app:
        <<: *app-base
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    worker:
        <<: *app-base
        command: /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf
        volumes:
            - ./:/var/www
            - ./docker/supervisor/supervisord-main.conf:/etc/supervisor/supervisord.conf:ro
            - ./docker/supervisor/laravel-worker.conf:/etc/supervisor/conf.d/laravel-worker.conf:ro
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8088}:80"
        volumes:
            - ./:/var/www:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_started
        networks:
            - backend

    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-learning}
            MYSQL_USER: ${DB_USERNAME:-learning}
            MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123456}
        ports:
            - "127.0.0.1:${DB_PORT:-3307}:3306"
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        networks:
            - backend

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: [ "redis-server", "--appendonly", "yes" ]
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 3s
            retries: 10
            start_period: 5s
        networks:
            - backend

networks:
    backend:
        driver: bridge

volumes:
    db_data:
    redis_data:
